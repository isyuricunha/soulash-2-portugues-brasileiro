name: PTBR Release
on:
  push:
    branches: [main]
    paths:
      - 'PTBR/**'
      - 'translation-work/build-manifest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ptbr-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify completed output
        run: python translation-work/toolkit.py verify-output
      - name: Publish verified package
        run: python translation-work/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
